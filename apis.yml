aid: bnrouter

name: bnrouter

image: https://www.bnrouter.com/images/og-1200x630.png

description: bnrouter provides a unified AI API gateway that consolidates multiple large language model providers such as Claude, GPT, Gemini,
  Kimi, DeepSeek, Qwen, Grok, Llama, and Flux behind a single OpenAI‑compatible endpoint. Users can create API keys, set usage quotas, monitor
  consumption, and pay per use, simplifying integration of diverse AI models into applications. The platform offers multilingual support, detailed
  documentation, pricing plans, and a developer console for managing keys and monitoring traffic.

